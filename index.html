<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Eurovision 2026 Grand Final Ranker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a0a4e 40%, #2d0a6e 100%);
      min-height: 100vh;
      padding: 16px;
      color: #fff;
    }

    h1 {
      text-align: center;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      background: linear-gradient(90deg, #ffe066, #ff6ec7, #6ec6ff, #ffe066);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.96); }

    .btn-reset {
      background: linear-gradient(90deg, #ff6ec7, #ff3a8c);
      color: #fff;
    }

    .btn-shuffle {
      background: linear-gradient(90deg, #6ec6ff, #3a8cff);
      color: #fff;
    }

    .list-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 8px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
      position: relative;
    }

    .song-item:active { cursor: grabbing; }

    .song-item.dragging {
      background: rgba(255, 220, 100, 0.18);
      border-color: #ffe066;
      box-shadow: 0 8px 32px rgba(255,220,100,0.25);
      transform: scale(1.03);
      z-index: 100;
      opacity: 0.95;
    }

    .song-item.drag-over {
      border-color: #ff6ec7;
      background: rgba(255,110,199,0.15);
    }

    .rank {
      font-size: 1.1rem;
      font-weight: 900;
      min-width: 30px;
      text-align: center;
      color: #ffe066;
    }

    .rank-1  { color: #FFD700; }
    .rank-2  { color: #C0C0C0; }
    .rank-3  { color: #CD7F32; }

    .flag {
      font-size: 2rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .artist {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-title {
      font-size: 0.8rem;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-style: italic;
    }

    .country {
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 1px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .drag-handle {
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem;
      flex-shrink: 0;
      padding: 0 2px;
    }

    .ghost-placeholder {
      opacity: 0 !important;
      pointer-events: none;
    }

    .drop-placeholder {
      border-radius: 10px;
      background: rgba(255, 110, 199, 0.1);
      border: 2px dashed rgba(255, 110, 199, 0.6);
      margin-bottom: 8px;
      animation: ph-pulse 0.9s ease-in-out infinite alternate;
    }

    @keyframes ph-pulse {
      from { border-color: rgba(255,110,199,0.35); background: rgba(255,110,199,0.07); }
      to   { border-color: rgba(255,110,199,0.85); background: rgba(255,110,199,0.18); }
    }

    .song-item {
      transition: background 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.18s, opacity 0.15s;
    }

    footer {
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.7rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>&#127926; Eurovision 2026</h1>
  <p class="subtitle">Grand Final Ranker &mdash; drag to rank your favourites</p>

  <div class="list-container" id="list"></div>

  <div class="controls">
    <button class="btn-reset" onclick="resetOrder()">&#8635; Reset Order</button>
  </div>

  <footer>Drag items up and down &bull; Works on mobile too &bull; Eurovision 2026 &bull; Vienna</footer>

<script>
  const songs = [
    { country: "Denmark",        flag: "🇩🇰", artist: "Søren Torpegaard Lund", song: "Før Vi Går Hjem" },
    { country: "Germany",        flag: "🇩🇪", artist: "Sarah Engels",           song: "Fire" },
    { country: "Israel",         flag: "🇮🇱", artist: "Noam Bettan",            song: "Michelle" },
    { country: "Belgium",        flag: "🇧🇪", artist: "ESSYLA",                 song: "Dancing on the Ice" },
    { country: "Albania",        flag: "🇦🇱", artist: "Alis",                   song: "Nân" },
    { country: "Greece",         flag: "🇬🇷", artist: "Akylas",                 song: "Ferto" },
    { country: "Ukraine",        flag: "🇺🇦", artist: "LELÉKA",                 song: "Ridnym" },
    { country: "Australia",      flag: "🇦🇺", artist: "Delta Goodrem",          song: "Eclipse" },
    { country: "Serbia",         flag: "🇷🇸", artist: "LAVINA",                 song: "Kraj Mene" },
    { country: "Malta",          flag: "🇲🇹", artist: "AIDAN",                  song: "Bella" },
    { country: "Czechia",        flag: "🇨🇿", artist: "Daniel Zizka",           song: "CROSSROADS" },
    { country: "Bulgaria",       flag: "🇧🇬", artist: "DARA",                   song: "Bangaranga" },
    { country: "Croatia",        flag: "🇭🇷", artist: "LELEK",                  song: "Andromeda" },
    { country: "United Kingdom", flag: "🇬🇧", artist: "LOOK MUM NO COMPUTER",   song: "Eins, Zwei, Drei" },
    { country: "France",         flag: "🇫🇷", artist: "Monroe",                 song: "Regarde !" },
    { country: "Moldova",        flag: "🇲🇩", artist: "Satoshi",                song: "Viva, Moldova!" },
    { country: "Finland",        flag: "🇫🇮", artist: "Linda Lampenius x Pete Parkkonen", song: "Liekinheitin" },
    { country: "Poland",         flag: "🇵🇱", artist: "ALICJA",                 song: "Pray" },
    { country: "Lithuania",      flag: "🇱🇹", artist: "Lion Ceccah",            song: "Sólo Quiero Más" },
    { country: "Sweden",         flag: "🇸🇪", artist: "FELICIA",                song: "My System" },
    { country: "Cyprus",         flag: "🇨🇾", artist: "Antigoni",               song: "JALLA" },
    { country: "Italy",          flag: "🇮🇹", artist: "Sal Da Vinci",           song: "Per Sempre Sì" },
    { country: "Norway",         flag: "🇳🇴", artist: "JONAS LOVV",             song: "YA YA YA" },
    { country: "Romania",        flag: "🇷🇴", artist: "Alexandra Căpitănescu",  song: "Choke Me" },
    { country: "Austria",        flag: "🇦🇹", artist: "COSMÓ",                  song: "Tanzschein" },
  ];

  const originalOrder = [...songs];
  let order = [...songs];

  // ── Render ──────────────────────────────────────────────────────────────────

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    order.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'song-item';
      el.draggable = true;
      el.dataset.index = i;

      const rankClass = i === 0 ? 'rank rank-1' : i === 1 ? 'rank rank-2' : i === 2 ? 'rank rank-3' : 'rank';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;

      el.innerHTML = `
        <div class="${rankClass}">${medal}</div>
        <div class="flag">${s.flag}</div>
        <div class="song-info">
          <div class="artist">${s.artist}</div>
          <div class="song-title">"${s.song}"</div>
          <div class="country">${s.country}</div>
        </div>
        <div class="drag-handle">&#8801;</div>
      `;

      attachDragEvents(el, i);
      attachTouchEvents(el, i);
      list.appendChild(el);
    });
  }

  // ── Mouse Drag & Drop ────────────────────────────────────────────────────────

  let dragSrcIndex = null;

  function attachDragEvents(el, index) {
    el.addEventListener('dragstart', e => {
      dragSrcIndex = index;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.song-item').forEach(i => i.classList.remove('drag-over', 'ghost'));
    });

    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.song-item').forEach(i => i.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });

    el.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrcIndex !== null && dragSrcIndex !== index) {
        const moved = order.splice(dragSrcIndex, 1)[0];
        order.splice(index, 0, moved);
        render();
      }
    });
  }

  // ── Touch Drag & Drop ────────────────────────────────────────────────────────

  const DRAG_DELAY   = 180;   // ms hold before drag activates
  const CANCEL_DIST  = 7;     // px movement cancels drag intent (lets scroll happen)
  const SCROLL_ZONE  = 85;    // px from screen edge → auto-scroll kicks in
  const SCROLL_SPEED = 9;     // px per frame

  let isDragging  = false;
  let dragSrcIdx  = null;
  let touchClone  = null;
  let ghostEl     = null;
  let placeholder = null;
  let touchStartY = 0;
  let touchStartX = 0;
  let touchLiveY  = 0;
  let rafId       = null;
  let scrollRafId = null;

  // Non-passive document listener blocks scroll while dragging
  function blockScroll(e) { e.preventDefault(); }

  function updateClonePos() {
    rafId = null;
    if (!touchClone) return;
    touchClone.style.transform =
      `translate3d(0, ${touchLiveY - touchStartY}px, 0) scale(1.05)`;
  }

  function startAutoScroll(clientY) {
    stopAutoScroll();
    const vh = window.innerHeight;
    const dir = clientY < SCROLL_ZONE ? -1 : clientY > vh - SCROLL_ZONE ? 1 : 0;
    if (!dir) return;
    function tick() { window.scrollBy(0, dir * SCROLL_SPEED); scrollRafId = requestAnimationFrame(tick); }
    scrollRafId = requestAnimationFrame(tick);
  }

  function stopAutoScroll() {
    if (scrollRafId) { cancelAnimationFrame(scrollRafId); scrollRafId = null; }
  }

  function updatePlaceholder(clientX, clientY) {
    if (!placeholder || !touchClone) return;
    const list = document.getElementById('list');

    touchClone.style.visibility  = 'hidden';
    placeholder.style.visibility = 'hidden';
    const below = document.elementFromPoint(clientX, clientY);
    touchClone.style.visibility  = 'visible';
    placeholder.style.visibility = 'visible';

    const target = below && below.closest('.song-item');
    if (!target || target === ghostEl) return;

    const rect     = target.getBoundingClientRect();
    const topHalf  = clientY < rect.top + rect.height / 2;
    list.insertBefore(placeholder, topHalf ? target : target.nextSibling);
  }

  function startDrag(el, index, touch) {
    isDragging = true;
    dragSrcIdx = index;
    touchLiveY = touch.clientY;

    const rect = el.getBoundingClientRect();

    // Invisible placeholder gap (same height as the item)
    placeholder = document.createElement('div');
    placeholder.className   = 'drop-placeholder';
    placeholder.style.height = rect.height + 'px';
    el.parentNode.insertBefore(placeholder, el.nextSibling);

    // Ghost: source item stays in DOM, holds its space, but is invisible
    ghostEl = el;
    el.classList.add('ghost-placeholder');

    // Flying clone — position locked via transform (GPU layer)
    touchClone = el.cloneNode(true);
    touchClone.classList.remove('ghost-placeholder');
    touchClone.style.cssText = `
      position:fixed; left:${rect.left}px; top:${rect.top}px;
      width:${rect.width}px; margin:0;
      z-index:9999; pointer-events:none;
      border-radius:14px;
      background:rgba(255,220,100,0.2); border:1.5px solid #ffe066;
      box-shadow:0 16px 50px rgba(0,0,0,0.65);
      will-change:transform;
      transform:translate3d(0,0,0) scale(1.05);
      opacity:0; transition:opacity 0.12s ease;
    `;
    document.body.appendChild(touchClone);
    requestAnimationFrame(() => { if (touchClone) touchClone.style.opacity = '0.95'; });

    // Block scroll for the rest of this gesture
    document.addEventListener('touchmove', blockScroll, { passive: false });
    navigator.vibrate && navigator.vibrate(15);
  }

  function endDrag() {
    if (!isDragging) return;

    // Derive new order by walking DOM children
    const list     = document.getElementById('list');
    const dragged  = order[dragSrcIdx];
    const newOrder = [];
    for (const child of list.children) {
      if (child === ghostEl)     continue;
      if (child === placeholder) { newOrder.push(dragged); continue; }
      const idx = parseInt(child.dataset.index);
      if (!isNaN(idx)) newOrder.push(order[idx]);
    }
    if (!newOrder.includes(dragged)) newOrder.push(dragged);

    order = newOrder;
    cleanupDrag();
    render();
  }

  function cleanupDrag() {
    isDragging = false;
    dragSrcIdx = null;
    stopAutoScroll();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    document.removeEventListener('touchmove', blockScroll);
    if (touchClone)  { touchClone.remove();  touchClone  = null; }
    if (placeholder) { placeholder.remove(); placeholder = null; }
    if (ghostEl)     { ghostEl.classList.remove('ghost-placeholder'); ghostEl = null; }
  }

  function attachTouchEvents(el, index) {
    let dragTimer = null;
    let hintTimer = null;

    el.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      touchStartY = touch.clientY;
      touchStartX = touch.clientX;
      touchLiveY  = touch.clientY;

      // Subtle scale hint at halfway to signal drag is available
      hintTimer = setTimeout(() => {
        if (!isDragging) {
          el.style.transition = 'transform 0.1s ease, border-color 0.1s ease';
          el.style.transform  = 'scale(1.025)';
          el.style.borderColor = 'rgba(255,220,100,0.5)';
        }
      }, DRAG_DELAY * 0.55);

      dragTimer = setTimeout(() => {
        startDrag(el, index, touch);
      }, DRAG_DELAY);
    }, { passive: true });

    // Passive — scroll detection only, blocking handled by document listener after drag starts
    el.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      touchLiveY  = touch.clientY;

      if (!isDragging) {
        // Cancel drag intent if user moves before timer fires (they're scrolling)
        if (Math.abs(touch.clientY - touchStartY) > CANCEL_DIST ||
            Math.abs(touch.clientX - touchStartX) > CANCEL_DIST) {
          clearTimeout(hintTimer);
          clearTimeout(dragTimer);
          el.style.transform   = '';
          el.style.borderColor = '';
          el.style.transition  = '';
        }
        return;
      }

      if (!rafId) rafId = requestAnimationFrame(updateClonePos);
      startAutoScroll(touch.clientY);
      updatePlaceholder(touch.clientX, touch.clientY);
    }, { passive: true });

    el.addEventListener('touchend', () => {
      clearTimeout(hintTimer);
      clearTimeout(dragTimer);
      el.style.transform   = '';
      el.style.borderColor = '';
      el.style.transition  = '';
      stopAutoScroll();
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (isDragging) endDrag();
    });

    el.addEventListener('touchcancel', () => {
      clearTimeout(hintTimer);
      clearTimeout(dragTimer);
      el.style.transform   = '';
      el.style.borderColor = '';
      el.style.transition  = '';
      stopAutoScroll();
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      if (isDragging) cleanupDrag();
    });
  }

  // ── Controls ─────────────────────────────────────────────────────────────────

  function resetOrder() {
    order = [...originalOrder];
    render();
  }

  function shuffleOrder() {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    render();
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  render();
</script>
</body>
</html>
